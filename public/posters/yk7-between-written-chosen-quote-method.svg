<text x="600" y="574" font-size="65" fill="#f4eedf" font-family="Amiri, 'Noto Naskh Arabic', 'Noto Serif Arabic', serif" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">ومع ذلك يبقى المنهج</text>
<text x="600" y="682" font-size="77" fill="#e7bf67" font-family="Amiri, 'Noto Naskh Arabic', 'Noto Serif Arabic', serif" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">بحاجة إلى مراجعة.</text>

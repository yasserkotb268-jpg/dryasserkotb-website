<text x="600" y="998" font-size="36" fill="#d8c49a" font-family="Amiri, 'Noto Naskh Arabic', 'Noto Serif Arabic', serif" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">منصة الرصد الاستراتيجي | YK7</text>
<text x="600" y="1070" font-size="30" fill="#ded4c4" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="2">dryasserkotb.com</text>

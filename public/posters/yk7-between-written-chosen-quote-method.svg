<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="اقتباس من بين ما كُتب لنا وما نختاره">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101f"/><stop offset=".55" stop-color="#0e233a"/><stop offset="1" stop-color="#12263b"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#d8a958" stop-opacity=".19"/><stop offset="1" stop-color="#d8a958" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a9762e" stop-opacity="0"/><stop offset=".5" stop-color="#e6c47e"/><stop offset="1" stop-color="#a9762e" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<circle cx="610" cy="585" r="540" fill="url(#light)"/>
<path d="M100 105 H1100" stroke="url(#gold)" stroke-width="3"/>
<text x="600" y="190" font-size="42" fill="#e4c47c" font-family="Amiri, 'Noto Naskh Arabic', 'Noto Serif Arabic', serif" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">من كتاب «بين ما كُتب لنا وما نختاره»</text>
<path d="M275 245 H515 M685 245 H925" stroke="#cfa75b" stroke-width="2" opacity=".65"/>

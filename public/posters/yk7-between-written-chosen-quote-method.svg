<text x="600" y="370" font-size="65" fill="#f4eedf" font-family="Amiri, 'Noto Naskh Arabic', 'Noto Serif Arabic', serif" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext">قد تكون القضية عادلة،</text>

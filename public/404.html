<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>الصفحة غير متاحة | الموقع الرسمي للدكتور ياسر قطب</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #14151b; color: #f4f4f5; font-family: "Amiri", "Arial", serif; }
    main { max-width: 620px; text-align: center; padding: 42px 24px; border: 1px solid #3f4049; border-radius: 18px; }
    .code { color: #e58a8a; font: bold 2.7rem Arial, sans-serif; }
    h1 { margin: 16px 0; font-size: 1.9rem; }
    p { line-height: 1.9; color: #d6d6db; }
    a { display: inline-block; margin-top: 14px; padding: 10px 22px; background: #8b2834; color: #fff; border-radius: 8px; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>هذه الصفحة غير متاحة</h1>
    <p>قد يكون الرابط غير صحيح، أو لم تعد المادة متاحة للنشر. يمكنك العودة إلى الصفحة الرئيسية والاطلاع على المحتوى المنشور.</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>

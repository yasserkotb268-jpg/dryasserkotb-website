name: YK7 Editorial PDF staging

on:
  push:
    branches:
      - yk7/editorial-staging-2026-10-24
    paths:
      - .github/workflows/yk7-editorial-pdf.yml
      - scripts/build_editorial_pdfs.py
      - public/articles/correct-words-without-stigma/index.html
      - public/articles/when-correction-becomes-stigma.html

permissions:
  contents: write

jobs:
  render-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Arabic font and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-hosny-amiri
          python -m pip install --disable-pip-version-check weasyprint==68.0 pypdf==6.1.1
      - name: Create and check the two PDFs
        run: python scripts/build_editorial_pdfs.py
      - name: Add only PDF artifacts to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/articles/correct-words-without-stigma-yk7-amiri19.pdf
          git add public/articles/when-correction-becomes-stigma-yk7-amiri19.pdf
          if ! git diff --cached --quiet; then
            git commit -m "YK7: stage two Arabic articles as searchable Amiri PDFs"
            git push
          fi
